name: build

on:
  push:
    branches:    
      - master

jobs:
  windows_images:
    name: docker images (windows)
    runs-on: windows-latest
    steps:
      - name: Pull source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment variables
        run: |
          "GORSE_VERSION=$(git describe --tags (git rev-parse HEAD))" >> $env:GITHUB_ENV
          "GORSE_GIT_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          "GORSE_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> $env:GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build docker image
        run: |
          foreach ($image in "gorse-master", "gorse-server", "gorse-worker", "gorse-in-one") {
            docker build -f cmd/$image/Dockerfile.windows `
              --build-arg "VERSION=$env:GORSE_VERSION" `
              --build-arg "GIT_COMMIT=$env:GORSE_GIT_COMMIT" `
              --build-arg "BUILD_TIME=$env:GORSE_BUILD_TIME" `
              -t zhenghaoz/${image}:nightly-windowsservercore .
            docker image push --all-tags zhenghaoz/$image
          }

  docker_images:
    name: docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        targets: [default]
    steps:
      - name: Pull source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment variables
        run: |
          echo "GORSE_VERSION=$(git describe --tags "$(git rev-parse HEAD)")" >> "$GITHUB_ENV"
          echo "GORSE_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "GORSE_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build docker image
        uses: docker/bake-action@v6
        with:
          source: .
          targets: ${{ matrix.targets }}
          push: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
